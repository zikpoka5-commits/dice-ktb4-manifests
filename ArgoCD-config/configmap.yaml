# 백엔드에 주입하는 "비밀이 아닌" 설정값.
# 비밀번호와 액세스 키는 여기 두지 않는다 (git에 올라가므로) → Secret이 담당한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: community-backend-config
  namespace: default
data:
  # prod 프로필: 데이터는 MySQL, 세션은 Redis, 파일은 S3에 둔다.
  # (k8s 프로필은 H2 인메모리라 Pod마다 데이터가 달라진다)
  SPRING_PROFILES_ACTIVE: "prod"

  # 클러스터 안의 MySQL Service 이름으로 접속한다.
  #   allowPublicKeyRetrieval: MySQL 8의 기본 인증 방식(caching_sha2)에 필요
  #   characterEncoding: 한글이 깨지지 않도록
  DB_URL: "jdbc:mysql://mysql:3306/crud?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
  DB_USERNAME: "root"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ⚠️ 아래 버킷 이름을 실제로 만든 S3 버킷 이름으로 바꿔야 한다.
  S3_BUCKET: "CHANGE-ME-bucket-name"
  S3_REGION: "ap-northeast-2"
