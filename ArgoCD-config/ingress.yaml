apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: community-backend
  namespace: default
spec: 
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: community-backend-svc
                port:
                  number: 8081